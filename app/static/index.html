<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e20" media="(prefers-color-scheme: dark)">
<title>JellyDupe</title>
<style>
:root{
  --sidebar:rgba(246,246,246,.72);
  --content:#ffffff;
  --raised:#ffffff;
  --hover:rgba(0,0,0,.04);
  --text:#1d1d1f;
  --text2:#86868b;
  --text3:#a1a1a6;
  --sep:rgba(0,0,0,.08);
  --accent:#007aff;
  --accent-soft:rgba(0,122,255,.1);
  --green:#34c759;
  --green-soft:rgba(52,199,89,.12);
  --orange:#ff9500;
  --orange-soft:rgba(255,149,0,.12);
  --chip:rgba(0,0,0,.05);
  --radius:12px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --sidebar:rgba(42,42,45,.72);
    --content:#1e1e20;
    --raised:#2a2a2d;
    --hover:rgba(255,255,255,.05);
    --text:#f5f5f7;
    --text2:#98989d;
    --text3:#86868b;
    --sep:rgba(255,255,255,.1);
    --accent:#0a84ff;
    --accent-soft:rgba(10,132,255,.15);
    --green:#32d74b;
    --green-soft:rgba(50,215,75,.16);
    --orange:#ff9500;
    --orange-soft:rgba(255,149,0,.16);
    --chip:rgba(255,255,255,.08);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--text);background:var(--content);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:260px;flex:0 0 260px;display:flex;flex-direction:column;background:var(--sidebar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:.5px solid var(--sep);padding:16px 12px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-mark{width:28px;height:28px;border-radius:8px;flex:0 0 28px;background:linear-gradient(160deg,#5ac8fa,#007aff 60%,#5e5ce6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.5px}
.brand span{display:block;font-size:11px;color:var(--text2);font-weight:400;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-title{font-size:10px;color:var(--text3);padding:10px 8px 6px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border:0;border-radius:8px;background:transparent;font-size:13.5px;transition:all .12s ease}
.nav-item:hover{background:var(--hover)}
.nav-item[aria-current="true"]{background:var(--accent);color:#fff;font-weight:600}
.nav-item[aria-current="true"] .count{background:rgba(255,255,255,.35)}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav-item .count{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;background:var(--chip);border-radius:20px;padding:3px 7px;color:var(--text2);font-weight:600}
.side-foot{margin-top:auto;padding:12px 8px 4px;border-top:.5px solid var(--sep)}
.space-saved{background:linear-gradient(135deg,var(--orange-soft),var(--accent-soft));border-radius:12px;padding:14px;margin-bottom:12px}
.space-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:700}
.space-number{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--text)}
.space-unit{font-size:14px;color:var(--text2);margin-left:4px}
.space-sub{font-size:12px;color:var(--text2);margin-top:3px}
.btn-row{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;background:var(--chip);transition:all .12s ease;cursor:pointer;width:100%}
.btn:hover{filter:brightness(.94)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-orange{background:var(--orange-soft);color:var(--orange)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--content)}
.toolbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:.5px solid var(--sep);flex-wrap:wrap}
.toolbar h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em}
.toolbar .meta{font-size:12px;color:var(--text2)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:9px;padding:6px 11px;min-width:200px}
.search input{border:0;background:transparent;outline:0;font:inherit;color:inherit;width:100%;font-weight:500}
.search svg{width:14px;height:14px;opacity:.5;flex:0 0 14px}
.scroll{flex:1;overflow-y:auto;padding:16px 20px 100px;scroll-behavior:smooth}
.list{display:flex;flex-direction:column;gap:14px;max-width:1300px}
.group{background:var(--raised);border-radius:var(--radius);box-shadow:0 0.5px 0 var(--sep), 0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.group-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(0,0,0,.02)}
@media (prefers-color-scheme:dark){.group-head{background:rgba(255,255,255,.02)}}
.poster{width:40px;height:58px;flex:0 0 40px;border-radius:6px;object-fit:cover;background:var(--chip)}
.group-info{min-width:0;flex:1}
.group-title{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}
.group-sub{font-size:12px;color:var(--text2)}
.group-stat{text-align:right;font-variant-numeric:tabular-nums}
.group-stat-big{font-size:14px;font-weight:700;color:var(--orange)}
.group-stat-sub{font-size:11px;color:var(--text2)}
.rows{border-top:.5px solid var(--sep)}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-top:.5px solid var(--sep);transition:background .12s ease;cursor:pointer}
.rows .row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row.picked{background:var(--accent-soft)}
.row.recommended{background:var(--orange-soft)}
.row-checkbox{flex:0 0 18px;margin-top:2px}
.row input[type=checkbox]{appearance:none;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--text2);background:transparent;display:grid;place-items:center;cursor:pointer;transition:all .12s ease}
.row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.row input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.row-content{min-width:0;flex:1}
.row-title{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text)}
.row-path{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--chip);color:var(--text2);white-space:nowrap}
.chip.res{background:var(--accent-soft);color:var(--accent)}
.chip.hdr{background:linear-gradient(100deg,#ffb340,#ff6482);color:#fff}
.chip.rec{background:var(--orange-soft);color:var(--orange)}
.chip.best{background:var(--green-soft);color:var(--green)}
.row-size{text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.row-size-big{font-size:13px;font-weight:700}
.row-size-sub{font-size:11px;color:var(--text2)}
.group-footer{padding:9px 14px;border-top:.5px solid var(--sep);display:flex;justify-content:flex-end;background:rgba(0,0,0,.01)}
@media (prefers-color-scheme:dark){.group-footer{background:rgba(255,255,255,.01)}}
.btn-small{border:0;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;background:var(--chip);color:var(--accent);cursor:pointer;transition:all .12s ease}
.btn-small:hover{background:var(--accent-soft)}
.state{max-width:440px;margin:12vh auto;text-align:center;color:var(--text2)}
.state h2{color:var(--text);font-size:18px;font-weight:700;margin:0 0 8px}
.state p{margin:0 0 20px;font-size:13.5px}
.spinner{width:28px;height:28px;margin:0 auto 16px;border-radius:50%;border:2.5px solid var(--sep);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.setup{max-width:420px;margin:8vh auto}
.setup h2{font-size:20px;font-weight:700;margin:0 0 8px}
.setup p{color:var(--text2);font-size:13.5px;margin:0 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.field input{width:100%;padding:9px 12px;border-radius:9px;border:.5px solid var(--sep);background:var(--raised);color:inherit;font:inherit;outline:0;font-weight:500}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:11px;color:var(--text2);margin-top:5px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);display:grid;place-items:start center;padding:0 16px;z-index:50}
.sheet{width:min(540px,100%);background:var(--raised);border-radius:0 0 16px 16px;box-shadow:0 0 0 .5px rgba(0,0,0,.1), 0 24px 60px rgba(0,0,0,.28);padding:22px;animation:drop .26s cubic-bezier(.2,.8,.3,1)}
@keyframes drop{from{transform:translateY(-20px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:16px;font-weight:700}
.sheet .lead{color:var(--text2);font-size:13px;margin:0 0 14px}
.sheet ul{list-style:none;margin:0 0 14px;padding:10px;max-height:240px;overflow-y:auto;background:var(--chip);border-radius:10px;font-family:var(--mono);font-size:11px}
.sheet li{padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.warn{background:var(--orange-soft);color:var(--orange);border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:14px;font-weight:600}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px}
.mobile-bar{display:none}
@media (max-width:900px){.app{flex-direction:column}.sidebar{width:100%;flex:0 0 auto;flex-direction:row;align-items:center;gap:8px;padding:10px 14px;border-right:0;border-bottom:.5px solid var(--sep);position:sticky;top:0;z-index:20}.brand{padding:0;flex:0 0 auto}.brand div{display:none}.nav{flex-direction:row;gap:4px;overflow-x:auto}.nav-title,.side-foot{display:none}.scroll{padding:12px 12px 120px}.toolbar{padding:10px 14px;gap:8px}.toolbar h1{font-size:15px}.search{min-width:0;flex:1;min-width:140px}.row{flex-wrap:wrap}.row-content{flex:1 1 100%}.row-size{width:100%;margin-top:4px;text-align:left}.mobile-bar{display:flex;align-items:center;gap:10px;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:12px 14px;border-radius:14px;background:var(--sidebar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 0 0 .5px rgba(0,0,0,.1), 0 24px 60px rgba(0,0,0,.28);z-index:30}.mobile-bar.hidden{display:none}.mobile-bar b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}.mobile-bar .space{display:flex;flex-direction:column}.mobile-bar .btn{margin-left:auto;width:auto}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}.scroll{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">JD</div>
      <div><b>JellyDupe</b><span id="serverName">Not connected</span></div>
    </div>

    <nav class="nav" id="nav" hidden>
      <div class="nav-title">Library</div>
      <button class="nav-item" data-kind="movie" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 12h18"/></svg>
        Movies <span class="count" id="countMovie">0</span>
      </button>
      <button class="nav-item" data-kind="episode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="13" rx="2.5"/><path d="m8 3 4 4 4-4"/></svg>
        Episodes <span class="count" id="countEpisode">0</span>
      </button>
    </nav>

    <div class="side-foot" id="sideFoot" hidden>
      <div class="space-saved">
        <div class="space-label">Space you can save</div>
        <div style="display:flex;align-items:baseline">
          <div class="space-number" id="reclaimNum">0</div>
          <div class="space-unit" id="reclaimUnit">GB</div>
        </div>
        <div class="space-sub" id="reclaimSub">No files selected</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-orange" id="recommendBtn" hidden>Recommended to delete</button>
        <button class="btn btn-primary" id="deleteBtn" disabled>Delete selected</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar" id="toolbar" hidden>
      <h1 id="viewTitle">Movies</h1>
      <span class="meta" id="viewMeta"></span>
      <div class="spacer"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search title" autocomplete="off">
      </label>
      <button class="btn btn-orange" style="width:auto;padding:6px 12px;font-size:12px" id="rescan">Scan again</button>
    </div>

    <div class="scroll" id="scroll">
      <div class="state">
        <div class="spinner"></div>
        <p>Starting up…</p>
      </div>
    </div>
  </main>
</div>

<div class="mobile-bar hidden" id="mobileBar">
  <div class="space">
    <b id="mobileSize" style="font-size:15px;font-variant-numeric:tabular-nums">0 GB</b>
    <small id="mobileSub">0 files</small>
  </div>
  <button class="btn btn-primary" id="mobileDelete" style="width:auto;padding:7px 12px">Delete</button>
</div>

<script>
const $ = s => document.querySelector(s);
const scroll = $('#scroll');
let kind = 'movie';
let groups = [];
let query = '';
const picked = new Map();
const recommended = new Set();

const api = async (path, opts) => {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `Error ${r.status}`);
  return data;
};

const nf = (n, d=1) => n.toLocaleString('en-US', {maximumFractionDigits:d});
function bytes(n){
  if (!n) return {v:'0', u:'GB'};
  const u = ['B','KB','MB','GB','TB'];
  let i = 0; let v = n;
  while (v >= 1024 && i < u.length-1){ v /= 1024; i++; }
  return {v: nf(v, v < 10 ? 1 : 0), u: u[i]};
}
const size = n => { const b = bytes(n); return `${b.v} ${b.u}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mbit = b => b ? `${nf(b/1e6, 1)} Mbps` : '—';

boot();
async function boot(){
  try {
    const cfg = await api('/api/config');
    if (!cfg.connected) return renderSetup();
    const st = await api('/api/status');
    if (st.status === 'idle') { await api('/api/scan', {method:'POST'}); return poll(); }
    if (st.status === 'scanning') return poll();
    if (st.status === 'error') return renderError(st.error);
    await load();
  } catch (e) { renderError(e.message); }
}

async function poll(){
  renderScanning('Connecting…');
  const tick = async () => {
    const st = await api('/api/status');
    if (st.status === 'scanning'){ renderScanning(st.message || 'Scanning library…'); return setTimeout(tick, 700); }
    if (st.status === 'error') return renderError(st.error);
    if (st.server) $('#serverName').textContent = st.server.serverName || 'Connected';
    await load();
  };
  tick();
}

async function load(){
  $('#nav').hidden = false;
  $('#sideFoot').hidden = false;
  $('#toolbar').hidden = false;
  const [m, e] = await Promise.all([api('/api/groups?kind=movie'), api('/api/groups?kind=episode')]);
  $('#countMovie').textContent = m.totals.groups;
  $('#countEpisode').textContent = e.totals.groups;
  groups = (kind === 'movie' ? m : e).groups;
  render();
}

function renderScanning(msg){
  scroll.innerHTML = `<div class="state"><div class="spinner"></div><h2>Scanning library</h2><p>${esc(msg)}</p></div>`;
}

function renderError(msg){
  scroll.innerHTML = `<div class="state"><h2>Scan failed</h2><div style="background:var(--orange-soft);color:var(--orange);border-radius:10px;padding:11px 14px;font-size:13px;margin:0 0 18px;text-align:left;font-weight:500">${esc(msg)}</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-primary" style="width:auto" onclick="location.reload()">Try again</button><button class="btn" style="width:auto;background:var(--chip)" onclick="renderSetup()">Change connection</button></div></div>`;
}

function renderSetup(){
  $('#nav').hidden = true; $('#sideFoot').hidden = true; $('#toolbar').hidden = true;
  scroll.innerHTML = `<div class="setup"><h2>Connect to Jellyfin</h2><p>Enter your Jellyfin server address and API key. Works with both internal IPs (192.168.x.x) and external addresses (jelly.broly.me).</p>
    <div class="field"><label for="url">Server address</label><input id="url" placeholder="http://192.168.1.10:8096 or jelly.broly.me:8096"><div class="hint">Same address you use to access Jellyfin.</div></div>
    <div class="field"><label for="key">API key</label><input id="key" type="password" placeholder="Paste your key here"><div class="hint">Jellyfin → Dashboard → API Keys → Create new.</div></div>
    <div id="setupErr"></div><button class="btn btn-primary" id="connect" style="width:100%;padding:10px">Connect</button></div>`;
  $('#connect').onclick = async () => {
    const btn = $('#connect'); btn.disabled = true; btn.textContent = 'Connecting…';
    try {
      const url = $('#url').value.trim();
      const finalUrl = url.startsWith('http') ? url : `http://${url}`;
      const res = await api('/api/config', {method:'POST', body: JSON.stringify({url: finalUrl, apiKey: $('#key').value})});
      $('#serverName').textContent = res.server.serverName || 'Connected';
      await api('/api/scan', {method:'POST'});
      poll();
    } catch (e) {
      $('#setupErr').innerHTML = `<div style="background:var(--orange-soft);color:var(--orange);border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;font-weight:500">${esc(e.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Connect';
    }
  };
}

function render(){
  const q = query.trim().toLowerCase();
  const list = q ? groups.filter(g => (g.title||'').toLowerCase().includes(q) || (g.series||'').toLowerCase().includes(q)) : groups;
  
  $('#viewTitle').textContent = kind === 'movie' ? 'Movies' : 'Episodes';
  const wasted = list.reduce((a,g) => a + g.wastedSize, 0);
  $('#viewMeta').textContent = list.length ? `${list.length} duplicates · ${size(wasted)} can be freed` : '';

  if (!list.length){
    scroll.innerHTML = `<div class="state"><h2>${q ? 'No results' : 'No duplicates'}</h2><p>${q ? 'Try a different title.' : 'Each ' + (kind === 'movie' ? 'movie' : 'episode') + ' is stored only once.'}</p></div>`;
    return;
  }

  scroll.innerHTML = `<div class="list">${list.map(card).join('')}</div>`;
  scroll.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = onPick);
  scroll.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => markRecommended(b.dataset.rec));
}

function card(g){
  const label = g.kind === 'movie' ? `${esc(g.title)}${g.year ? ' (' + g.year + ')' : ''}` : `${esc(g.series)}`;
  const ep = g.kind === 'episode' ? ` • S${String(g.season).padStart(2,'0')}E${String(g.episode).padStart(2,'0')} ${esc(g.title)}` : '';
  
  return `<article class="group">
    <header class="group-head">
      <img class="poster" src="/api/image/${g.poster}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="group-info">
        <div class="group-title">${label}${ep}</div>
        <div class="group-sub">${g.count} files · ${size(g.totalSize)}</div>
      </div>
      <div class="group-stat">
        <div class="group-stat-big">${size(g.wastedSize)}</div>
        <div class="group-stat-sub">can free</div>
      </div>
    </header>
    <div class="rows">${g.versions.map(v => row(v, g)).join('')}</div>
    <footer class="group-footer"><button class="btn-small" data-rec="${g.key}">Mark recommended</button></footer>
  </article>`;
}

function row(v, g){
  const picked_state = picked.has(v.sourceId);
  const rec_state = recommended.has(v.sourceId);
  const audio = v.audioCodec ? `${v.audioCodec}${v.audioChannels ? ' ' + channels(v.audioChannels) : ''}` : null;
  const filename = v.path.split('/').pop();
  const chips = [
    `<span class="chip res">${esc(v.resolution)}</span>`,
    v.videoCodec ? `<span class="chip">${esc(v.videoCodec)}</span>` : '',
    v.videoRange && v.videoRange !== 'SDR' ? `<span class="chip hdr">${esc(v.videoRange)}</span>` : '',
    audio ? `<span class="chip">${esc(audio)}</span>` : '',
    v.container ? `<span class="chip">${esc(v.container)}</span>` : '',
    v.subtitles ? `<span class="chip">${v.subtitles} subtitle${v.subtitles === 1 ? '' : 's'}</span>` : '',
    rec_state ? `<span class="chip rec">Recommended</span>` : '',
    v.best ? `<span class="chip best">Best quality</span>` : ''
  ].join('');

  return `<label class="row${picked_state ? ' picked' : ''}${rec_state ? ' recommended' : ''}">
    <div class="row-checkbox"><input type="checkbox" ${picked_state ? 'checked' : ''} data-id="${v.sourceId}" data-size="${v.size}" data-best="${v.best ? 1 : 0}" data-path="${esc(v.path)}" data-title="${esc(g.kind === 'movie' ? g.title : g.series)}"></div>
    <div class="row-content">
      <div class="row-title">${esc(filename)}</div>
      <div class="row-path" title="${esc(v.path)}">${esc(v.path)}</div>
      <div class="chips">${chips}</div>
    </div>
    <div class="row-size">
      <div class="row-size-big">${size(v.size)}</div>
      <div class="row-size-sub">${mbit(v.bitrate)}</div>
    </div>
  </label>`;
}

const channels = n => ({1:'1.0',2:'2.0',6:'5.1',8:'7.1'}[n] || `${n}ch`);

function onPick(e){
  const d = e.target.dataset;
  if (e.target.checked) {
    picked.set(d.id, {size:+d.size, path:d.path, title:d.title, best:d.best === '1'});
    recommended.delete(d.id);
  } else {
    picked.delete(d.id);
  }
  e.target.closest('.row').classList.toggle('picked', e.target.checked);
  updateBar();
}

function markRecommended(key){
  const g = groups.find(x => x.key === key);
  if (!g) return;
  picked.clear();
  recommended.clear();
  g.versions.filter(v => !v.best).forEach(v => recommended.add(v.sourceId));
  render();
  updateBar();
}

function updateBar(){
  const total = [...picked.values()].reduce((a,v) => a + v.size, 0);
  const b = bytes(total);
  $('#reclaimNum').textContent = b.v;
  $('#reclaimUnit').textContent = b.u;
  $('#reclaimSub').textContent = picked.size ? `${picked.size} ${picked.size === 1 ? 'file' : 'files'} selected` : 'No files selected';
  $('#deleteBtn').disabled = !picked.size;
  $('#deleteBtn').textContent = picked.size ? `Delete ${picked.size} ${picked.size === 1 ? 'file' : 'files'}` : 'Delete selected';
  $('#recommendBtn').hidden = !recommended.size;
  
  const bar = $('#mobileBar');
  bar.classList.toggle('hidden', !picked.size);
  $('#mobileSize').textContent = size(total);
  $('#mobileSub').textContent = `${picked.size} ${picked.size === 1 ? 'file' : 'files'}`;
}

function confirmDelete(){
  const items = [...picked.entries()];
  const total = items.reduce((a,[,v]) => a + v.size, 0);
  const risky = items.filter(([,v]) => v.best).length;

  const el = document.createElement('div');
  el.className = 'backdrop';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <h3>Delete ${items.length} ${items.length === 1 ? 'file' : 'files'}?</h3>
    <p class="lead">Jellyfin will remove these files from disk. This cannot be undone.</p>
    ${risky ? `<div class="warn">${risky} ${risky === 1 ? 'is' : 'are'} marked as best quality.</div>` : ''}
    <ul>${items.map(([,v]) => `<li title="${esc(v.path)}">${esc(v.path)}</li>`).join('')}</ul>
    <div class="sheet-actions">
      <label style="font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="dry"> Test run
      </label>
      <button class="btn" style="width:auto;background:var(--chip);padding:6px 12px" id="cancel">Cancel</button>
      <button class="btn btn-primary" style="width:auto;padding:6px 14px" id="go">Delete ${size(total)}</button>
    </div></div>`;
  document.body.appendChild(el);

  const close = () => el.remove();
  el.onclick = e => { if (e.target === el) close(); };
  el.querySelector('#cancel').onclick = close;
  document.addEventListener('keydown', function esc2(e){
    if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', esc2); }
  });
  el.querySelector('#go').focus();
  el.querySelector('#go').onclick = async () => {
    const dry = el.querySelector('#dry').checked;
    const btn = el.querySelector('#go'); btn.disabled = true; btn.textContent = 'Deleting…';
    try {
      const res = await api('/api/delete', {method:'POST', body: JSON.stringify({ids: items.map(([id]) => id), dryRun: dry})});
      close();
      if (!dry) picked.clear();
      recommended.clear();
      updateBar();
      await load();
      if (res.failed) alert(`${res.deleted} deleted, ${res.failed} failed.`);
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Try again';
      el.querySelector('.lead').innerHTML = `<span style="color:var(--orange)">${esc(e.message)}</span>`;
    }
  };
}

$('#nav').onclick = e => {
  const b = e.target.closest('.nav-item'); if (!b) return;
  kind = b.dataset.kind;
  document.querySelectorAll('.nav-item').forEach(n => n.setAttribute('aria-current', String(n === b)));
  picked.clear();
  recommended.clear();
  load();
};
$('#search').oninput = e => { query = e.target.value; render(); };
$('#deleteBtn').onclick = confirmDelete;
$('#mobileDelete').onclick = confirmDelete;
$('#rescan').onclick = () => {
  picked.clear();
  recommended.clear();
  updateBar();
  api('/api/scan', {method:'POST'}).then(poll);
};
window.renderSetup = renderSetup;
</script>
</body>
</html>
