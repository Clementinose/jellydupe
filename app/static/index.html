<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e20" media="(prefers-color-scheme: dark)">
<title>JellyDupe</title>
<style>
:root{
  --sidebar:rgba(246,246,246,.72);
  --sidebar-solid:#f2f2f4;
  --content:#ffffff;
  --raised:#ffffff;
  --hover:rgba(0,0,0,.045);
  --text:#1d1d1f;
  --text2:#86868b;
  --sep:rgba(0,0,0,.09);
  --accent:#007aff;
  --accent-soft:rgba(0,122,255,.12);
  --red:#ff3b30;
  --red-soft:rgba(255,59,48,.12);
  --green:#34c759;
  --green-soft:rgba(52,199,89,.14);
  --chip:rgba(0,0,0,.06);
  --radius:12px;
  --shadow:0 0 0 .5px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
  --shadow-lg:0 0 0 .5px rgba(0,0,0,.1), 0 24px 60px rgba(0,0,0,.28);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --sidebar:rgba(42,42,45,.72);
    --sidebar-solid:#2a2a2d;
    --content:#1e1e20;
    --raised:#2a2a2d;
    --hover:rgba(255,255,255,.06);
    --text:#f5f5f7;
    --text2:#98989d;
    --sep:rgba(255,255,255,.1);
    --accent:#0a84ff;
    --accent-soft:rgba(10,132,255,.2);
    --red:#ff453a;
    --red-soft:rgba(255,69,58,.18);
    --green:#32d74b;
    --green-soft:rgba(50,215,75,.18);
    --chip:rgba(255,255,255,.09);
    --shadow:0 0 0 .5px rgba(255,255,255,.08), 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 0 0 .5px rgba(255,255,255,.1), 0 24px 60px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--text);background:var(--content);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- skelett ---------- */
.app{display:flex;height:100dvh;overflow:hidden}

.sidebar{
  width:236px;flex:0 0 236px;display:flex;flex-direction:column;
  background:var(--sidebar);backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-right:.5px solid var(--sep);padding:14px 10px 10px;
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.brand-mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:linear-gradient(160deg,#5ac8fa,#007aff 60%,#5e5ce6);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;
  box-shadow:0 1px 3px rgba(0,0,0,.25)
}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:var(--text2);font-weight:400}

.nav{display:flex;flex-direction:column;gap:1px}
.nav-title{font-size:11px;color:var(--text2);padding:8px 8px 4px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:6px 8px;border:0;border-radius:7px;background:transparent;font-size:13.5px;
}
.nav-item:hover{background:var(--hover)}
.nav-item[aria-current="true"]{background:var(--accent);color:#fff}
.nav-item[aria-current="true"] .count{background:rgba(255,255,255,.25);color:#fff}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav-item .count{
  margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;
  background:var(--chip);border-radius:20px;padding:1px 7px;color:var(--text2)
}

.side-foot{margin-top:auto;padding:10px 8px 4px;border-top:.5px solid var(--sep)}
.reclaim-label{font-size:11.5px;color:var(--text2)}
.reclaim{font-size:27px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2}
.reclaim small{font-size:14px;font-weight:500;color:var(--text2);margin-left:2px}
.reclaim-sub{font-size:11.5px;color:var(--text2);margin-bottom:10px}
.btn{
  border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;
  background:var(--chip);transition:filter .12s ease
}
.btn:hover{filter:brightness(.94)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn-danger{background:var(--red);color:#fff;width:100%}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--accent);padding:6px 8px}
.btn-row{display:flex;gap:8px}

/* ---------- innehåll ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--content)}
.toolbar{
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:.5px solid var(--sep);flex-wrap:wrap
}
.toolbar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.toolbar .meta{font-size:12px;color:var(--text2)}
.spacer{flex:1}
.search{
  display:flex;align-items:center;gap:6px;background:var(--chip);
  border-radius:8px;padding:5px 10px;min-width:190px
}
.search input{border:0;background:transparent;outline:0;font:inherit;color:inherit;width:100%}
.search svg{width:14px;height:14px;opacity:.5;flex:0 0 14px}
.scroll{flex:1;overflow-y:auto;padding:16px 20px 120px;scroll-behavior:smooth}
.list{display:flex;flex-direction:column;gap:12px;max-width:1180px}

/* ---------- gruppkort ---------- */
.group{
  background:var(--raised);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden
}
.group-head{display:flex;align-items:center;gap:12px;padding:11px 14px}
.poster{
  width:34px;height:50px;flex:0 0 34px;border-radius:5px;object-fit:cover;
  background:var(--chip);box-shadow:0 1px 2px rgba(0,0,0,.15)
}
.group-title{min-width:0;flex:1}
.group-title strong{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-title span{font-size:12px;color:var(--text2);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-stat{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.group-stat b{display:block;font-size:13.5px;font-weight:600}
.group-stat span{font-size:11.5px;color:var(--text2)}

.rows{border-top:.5px solid var(--sep)}
.row{
  display:flex;align-items:center;gap:12px;padding:9px 14px;
  border-top:.5px solid var(--sep);position:relative
}
.rows .row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row.picked{background:var(--red-soft)}
.row input[type=checkbox]{
  appearance:none;width:17px;height:17px;flex:0 0 17px;border-radius:5px;
  border:1.5px solid var(--text2);background:transparent;display:grid;place-items:center;
  cursor:pointer;transition:background .12s ease,border-color .12s ease
}
.row input[type=checkbox]:checked{background:var(--red);border-color:var(--red)}
.row input[type=checkbox]:checked::after{
  content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;
  transform:rotate(-45deg) translate(1px,-1px)
}
.cell{min-width:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:3px}
.chip{
  font-size:11px;font-weight:500;padding:1.5px 7px;border-radius:5px;
  background:var(--chip);color:var(--text2);white-space:nowrap
}
.chip.res{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.hdr{background:linear-gradient(100deg,#ffb340,#ff6482);color:#fff}
.chip.keep{background:var(--green-soft);color:var(--green);font-weight:600}
.path{font-family:var(--mono);font-size:11px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.path bdi{direction:ltr;unicode-bidi:embed}
.row-size{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-size b{display:block;font-size:13px;font-weight:600}
.row-size span{font-size:11px;color:var(--text2)}
.group-foot{padding:7px 14px;border-top:.5px solid var(--sep);display:flex;justify-content:flex-end}

/* ---------- tillstånd ---------- */
.state{
  max-width:420px;margin:14vh auto;text-align:center;color:var(--text2)
}
.state h2{color:var(--text);font-size:17px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.state p{margin:0 0 18px;font-size:13.5px}
.spinner{
  width:26px;height:26px;margin:0 auto 16px;border-radius:50%;
  border:2.5px solid var(--sep);border-top-color:var(--accent);animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
  background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;
  font-size:13px;text-align:left;margin-bottom:16px
}

/* ---------- installation ---------- */
.setup{max-width:400px;margin:10vh auto}
.setup h2{font-size:19px;margin:0 0 6px;letter-spacing:-.02em}
.setup p{color:var(--text2);font-size:13.5px;margin:0 0 20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.field input{
  width:100%;padding:8px 11px;border-radius:8px;border:.5px solid var(--sep);
  background:var(--raised);color:inherit;font:inherit;outline:0;box-shadow:var(--shadow)
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:11.5px;color:var(--text2);margin-top:4px}

/* ---------- ark ---------- */
.backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);
  display:grid;place-items:start center;padding:0 16px;z-index:50
}
.sheet{
  width:min(520px,100%);background:var(--raised);border-radius:0 0 14px 14px;
  box-shadow:var(--shadow-lg);padding:20px;animation:drop .26s cubic-bezier(.2,.8,.3,1)
}
@keyframes drop{from{transform:translateY(-24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:15px;letter-spacing:-.01em}
.sheet .lead{color:var(--text2);font-size:13px;margin:0 0 14px}
.sheet ul{list-style:none;margin:0 0 14px;padding:10px;max-height:210px;overflow-y:auto;
  background:var(--chip);border-radius:9px;font-family:var(--mono);font-size:11.5px}
.sheet li{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.sheet li bdi{direction:ltr;unicode-bidi:embed}
.warn{background:var(--red-soft);color:var(--red);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dry{margin-right:auto;font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px}

/* ---------- mobil ---------- */
.mobile-bar{display:none}
@media (max-width:820px){
  .app{flex-direction:column}
  .sidebar{
    width:100%;flex:0 0 auto;flex-direction:row;align-items:center;gap:8px;
    padding:10px 14px;border-right:0;border-bottom:.5px solid var(--sep);
    position:sticky;top:0;z-index:20
  }
  .brand{padding:0;flex:0 0 auto}
  .brand div{display:none}
  .nav{flex-direction:row;gap:6px;overflow-x:auto}
  .nav-title,.side-foot{display:none}
  .scroll{padding:12px 12px 130px}
  .toolbar{padding:10px 14px;gap:8px}
  .toolbar h1{display:none}
  .toolbar .meta{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toolbar .spacer{display:none}
  .search{min-width:0;flex:1 1 100%;order:5}
  #rescan{flex:0 0 auto}
  .state{margin:8vh auto}
  .row{flex-wrap:wrap;row-gap:4px}
  .cell{flex:1 1 140px}
  .row-size{margin-left:auto}
  .mobile-bar{
    display:flex;align-items:center;gap:10px;position:fixed;left:12px;right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom));padding:10px 12px;border-radius:14px;
    background:var(--sidebar);backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow-lg);z-index:30
  }
  .mobile-bar.hidden{display:none}
  .mobile-bar b{font-size:14px;font-variant-numeric:tabular-nums}
  .mobile-bar small{display:block;color:var(--text2);font-size:11.5px}
  .mobile-bar .btn-danger{width:auto;margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .scroll{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">JD</div>
      <div><b>JellyDupe</b><span id="serverName">inte ansluten</span></div>
    </div>

    <nav class="nav" id="nav" hidden>
      <div class="nav-title">Bibliotek</div>
      <button class="nav-item" data-kind="movie" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 12h18"/></svg>
        Filmer <span class="count" id="countMovie">0</span>
      </button>
      <button class="nav-item" data-kind="episode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="7" width="20" height="13" rx="2.5"/><path d="m8 3 4 4 4-4"/></svg>
        Avsnitt <span class="count" id="countEpisode">0</span>
      </button>
    </nav>

    <div class="side-foot" id="sideFoot" hidden>
      <div class="reclaim-label">Markerat att radera</div>
      <div class="reclaim" id="reclaim">0<small>GB</small></div>
      <div class="reclaim-sub" id="reclaimSub">inga filer valda</div>
      <button class="btn btn-danger" id="deleteBtn" disabled>Radera markerade</button>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar" id="toolbar" hidden>
      <h1 id="viewTitle">Filmer</h1>
      <span class="meta" id="viewMeta"></span>
      <div class="spacer"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Sök titel" autocomplete="off">
      </label>
      <button class="btn" id="rescan">Skanna om</button>
    </div>

    <div class="scroll" id="scroll">
      <div class="state">
        <div class="spinner"></div>
        <p>Startar …</p>
      </div>
    </div>
  </main>
</div>

<div class="mobile-bar hidden" id="mobileBar">
  <div><b id="mobileSize">0 GB</b><small id="mobileSub">0 filer</small></div>
  <button class="btn btn-danger" id="mobileDelete">Radera</button>
</div>

<script>
const $ = s => document.querySelector(s);
const scroll = $('#scroll');
let kind = 'movie';
let groups = [];
let query = '';
const picked = new Map();   // sourceId -> {size, path, title, best}

/* ---------- hjälpare ---------- */
const api = async (path, opts) => {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `Fel ${r.status}`);
  return data;
};
const nf = (n, d=1) => n.toLocaleString('sv-SE', {maximumFractionDigits:d});
function bytes(n){
  if (!n) return {v:'0', u:'GB'};
  const u = ['B','KB','MB','GB','TB'];
  let i = 0; let v = n;
  while (v >= 1024 && i < u.length-1){ v /= 1024; i++; }
  return {v: nf(v, v < 10 ? 1 : 0), u: u[i]};
}
const size = n => { const b = bytes(n); return `${b.v} ${b.u}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mbit = b => b ? `${nf(b/1e6, 1)} Mbit/s` : '—';

/* ---------- start ---------- */
boot();
async function boot(){
  try {
    const cfg = await api('/api/config');
    if (!cfg.connected) return renderSetup();
    const st = await api('/api/status');
    if (st.status === 'idle') { await api('/api/scan', {method:'POST'}); return poll(); }
    if (st.status === 'scanning') return poll();
    if (st.status === 'error') return renderError(st.error);
    await load();
  } catch (e) { renderError(e.message); }
}

async function poll(){
  renderScanning('Ansluter …');
  const tick = async () => {
    const st = await api('/api/status');
    if (st.status === 'scanning'){ renderScanning(st.message || 'Skannar biblioteket …'); return setTimeout(tick, 700); }
    if (st.status === 'error') return renderError(st.error);
    if (st.server) $('#serverName').textContent = st.server.serverName || 'ansluten';
    await load();
  };
  tick();
}

async function load(){
  const st = await api('/api/status');
  if (st.server) $('#serverName').textContent = st.server.serverName || 'ansluten';
  $('#nav').hidden = false;
  $('#sideFoot').hidden = false;
  $('#toolbar').hidden = false;
  const [m, e] = await Promise.all([api('/api/groups?kind=movie'), api('/api/groups?kind=episode')]);
  $('#countMovie').textContent = m.totals.groups;
  $('#countEpisode').textContent = e.totals.groups;
  groups = (kind === 'movie' ? m : e).groups;
  render();
}

/* ---------- vyer ---------- */
function renderScanning(msg){
  scroll.innerHTML = `<div class="state"><div class="spinner"></div>
    <h2>Läser igenom biblioteket</h2><p>${esc(msg)}</p></div>`;
}

function renderError(msg){
  scroll.innerHTML = `<div class="state">
    <h2>Skanningen stoppade</h2>
    <div class="error-box">${esc(msg)}</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" onclick="rescan()">Försök igen</button>
      <button class="btn" onclick="renderSetup()">Ändra anslutning</button>
    </div></div>`;
}

function renderSetup(){
  $('#nav').hidden = true; $('#sideFoot').hidden = true; $('#toolbar').hidden = true;
  scroll.innerHTML = `<div class="setup">
    <h2>Anslut till Jellyfin</h2>
    <p>JellyDupe läser biblioteket via Jellyfins API och raderar bara det du markerar.</p>
    <div class="field"><label for="url">Serveradress</label>
      <input id="url" placeholder="http://192.168.1.10:8096" value="${esc(location.origin.replace(/:\d+$/, ':8096'))}">
      <div class="hint">Samma adress som du öppnar Jellyfin på.</div></div>
    <div class="field"><label for="key">API-nyckel</label>
      <input id="key" type="password" placeholder="Klistra in nyckeln">
      <div class="hint">Jellyfin → Instrumentpanel → API-nycklar → Ny nyckel.</div></div>
    <div id="setupErr"></div>
    <button class="btn btn-primary" id="connect">Anslut</button>
  </div>`;
  $('#connect').onclick = async () => {
    const btn = $('#connect'); btn.disabled = true; btn.textContent = 'Ansluter …';
    try {
      const res = await api('/api/config', {method:'POST', body: JSON.stringify({url: $('#url').value, apiKey: $('#key').value})});
      $('#serverName').textContent = res.server.serverName || 'ansluten';
      await api('/api/scan', {method:'POST'});
      poll();
    } catch (e) {
      $('#setupErr').innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Anslut';
    }
  };
}

function render(){
  const q = query.trim().toLowerCase();
  const list = q
    ? groups.filter(g => (g.title||'').toLowerCase().includes(q) || (g.series||'').toLowerCase().includes(q))
    : groups;

  $('#viewTitle').textContent = kind === 'movie' ? 'Filmer' : 'Avsnitt';
  const wasted = list.reduce((a,g) => a + g.wastedSize, 0);
  $('#viewMeta').textContent = list.length
    ? `${list.length} dubbletter · ${size(wasted)} kan frigöras`
    : '';

  if (!list.length){
    scroll.innerHTML = `<div class="state"><h2>${q ? 'Inget matchar sökningen' : 'Inga dubbletter här'}</h2>
      <p>${q ? 'Prova en annan titel.' : 'Biblioteket har en fil per ' + (kind === 'movie' ? 'film' : 'avsnitt') + '.'}</p></div>`;
    return;
  }

  scroll.innerHTML = `<div class="list">${list.map(card).join('')}</div>`;
  scroll.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = onPick);
  scroll.querySelectorAll('[data-rest]').forEach(b => b.onclick = () => pickRest(b.dataset.rest));
}

function card(g){
  const label = g.kind === 'movie'
    ? `${esc(g.title)}${g.year ? ' (' + g.year + ')' : ''}`
    : `${esc(g.series)} · S${String(g.season).padStart(2,'0')}E${String(g.episode).padStart(2,'0')}`;
  const sub = g.kind === 'movie'
    ? `${g.count} filer · totalt ${size(g.totalSize)}`
    : `${esc(g.title)} · ${g.count} filer · totalt ${size(g.totalSize)}`;

  return `<article class="group">
    <header class="group-head">
      <img class="poster" src="/api/image/${g.poster}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="group-title"><strong>${label}</strong><span>${sub}</span></div>
      <div class="group-stat"><b>${size(g.wastedSize)}</b><span>kan frigöras</span></div>
    </header>
    <div class="rows">${g.versions.map(v => row(v, g)).join('')}</div>
    <footer class="group-foot">
      <button class="btn btn-ghost" data-rest="${g.key}">Markera alla utom bästa</button>
    </footer>
  </article>`;
}

function row(v, g){
  const on = picked.has(v.sourceId);
  const audio = v.audioCodec ? `${v.audioCodec}${v.audioChannels ? ' ' + channels(v.audioChannels) : ''}` : null;
  const chips = [
    `<span class="chip res">${esc(v.resolution)}</span>`,
    v.videoCodec ? `<span class="chip">${esc(v.videoCodec)}</span>` : '',
    v.videoRange && v.videoRange !== 'SDR' ? `<span class="chip hdr">${esc(v.videoRange)}</span>` : '',
    audio ? `<span class="chip">${esc(audio)}</span>` : '',
    v.container ? `<span class="chip">${esc(v.container)}</span>` : '',
    v.subtitles ? `<span class="chip">${v.subtitles} ${v.subtitles === 1 ? 'undertext' : 'undertexter'}</span>` : '',
    v.best ? `<span class="chip keep">Bästa kvalitet</span>` : ''
  ].join('');

  return `<label class="row${on ? ' picked' : ''}">
    <input type="checkbox" ${on ? 'checked' : ''}
      data-id="${v.sourceId}" data-size="${v.size}" data-best="${v.best ? 1 : 0}"
      data-path="${esc(v.path)}" data-title="${esc(g.kind === 'movie' ? g.title : g.series + ' S' + g.season + 'E' + g.episode)}">
    <div class="cell">
      <div class="chips">${chips}</div>
      <div class="path" title="${esc(v.path)}"><bdi>${esc(v.path)}</bdi></div>
    </div>
    <div class="row-size"><b>${size(v.size)}</b><span>${mbit(v.bitrate)}</span></div>
  </label>`;
}

const channels = n => ({1:'1.0',2:'2.0',6:'5.1',8:'7.1'}[n] || `${n}ch`);

/* ---------- markering ---------- */
function onPick(e){
  const d = e.target.dataset;
  if (e.target.checked) picked.set(d.id, {size:+d.size, path:d.path, title:d.title, best:d.best === '1'});
  else picked.delete(d.id);
  e.target.closest('.row').classList.toggle('picked', e.target.checked);
  updateBar();
}

function pickRest(key){
  const g = groups.find(x => x.key === key);
  if (!g) return;
  g.versions.filter(v => !v.best).forEach(v => {
    picked.set(v.sourceId, {size:v.size, path:v.path, best:false,
      title: g.kind === 'movie' ? g.title : `${g.series} S${g.season}E${g.episode}`});
  });
  render(); updateBar();
}

function updateBar(){
  const total = [...picked.values()].reduce((a,v) => a + v.size, 0);
  const b = bytes(total);
  $('#reclaim').innerHTML = `${b.v}<small>${b.u}</small>`;
  $('#reclaimSub').textContent = picked.size ? `${picked.size} ${picked.size === 1 ? 'fil' : 'filer'} valda` : 'inga filer valda';
  $('#deleteBtn').disabled = !picked.size;
  $('#deleteBtn').textContent = picked.size ? `Radera ${picked.size} ${picked.size === 1 ? 'fil' : 'filer'}` : 'Radera markerade';
  const bar = $('#mobileBar');
  bar.classList.toggle('hidden', !picked.size);
  $('#mobileSize').textContent = size(total);
  $('#mobileSub').textContent = `${picked.size} ${picked.size === 1 ? 'fil' : 'filer'}`;
}

/* ---------- radering ---------- */
function confirmDelete(){
  const items = [...picked.entries()];
  const total = items.reduce((a,[,v]) => a + v.size, 0);
  const risky = items.filter(([,v]) => v.best).length;

  const el = document.createElement('div');
  el.className = 'backdrop';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Bekräfta radering">
    <h3>Radera ${items.length} ${items.length === 1 ? 'fil' : 'filer'}?</h3>
    <p class="lead">Jellyfin tar bort filerna från disken på Hugoria. Det går inte att ångra härifrån.</p>
    ${risky ? `<div class="warn">${risky} av filerna är markerade som bästa kvalitet i sin grupp.</div>` : ''}
    <ul>${items.map(([,v]) => `<li title="${esc(v.path)}"><bdi>${esc(v.path)}</bdi></li>`).join('')}</ul>
    <div class="sheet-actions">
      <label class="dry"><input type="checkbox" id="dry"> Testkör utan att radera</label>
      <button class="btn" id="cancel">Avbryt</button>
      <button class="btn btn-danger" style="width:auto" id="go">Radera ${size(total)}</button>
    </div></div>`;
  document.body.appendChild(el);

  const close = () => el.remove();
  el.onclick = e => { if (e.target === el) close(); };
  el.querySelector('#cancel').onclick = close;
  document.addEventListener('keydown', function esc2(e){
    if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', esc2); }
  });
  el.querySelector('#go').focus();
  el.querySelector('#go').onclick = async () => {
    const dry = el.querySelector('#dry').checked;
    const btn = el.querySelector('#go'); btn.disabled = true; btn.textContent = 'Raderar …';
    try {
      const res = await api('/api/delete', {method:'POST',
        body: JSON.stringify({ids: items.map(([id]) => id), dryRun: dry})});
      close();
      if (!dry) picked.clear();
      updateBar();
      await load();
      if (res.failed) alert(`${res.deleted} filer raderade, ${res.failed} misslyckades. Kontrollera att API-nyckelns användare får radera media i Jellyfin.`);
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Försök igen';
      el.querySelector('.lead').innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
    }
  };
}

/* ---------- händelser ---------- */
$('#nav').onclick = e => {
  const b = e.target.closest('.nav-item'); if (!b) return;
  kind = b.dataset.kind;
  document.querySelectorAll('.nav-item').forEach(n => n.setAttribute('aria-current', String(n === b)));
  load();
};
$('#search').oninput = e => { query = e.target.value; render(); };
$('#deleteBtn').onclick = confirmDelete;
$('#mobileDelete').onclick = confirmDelete;
$('#rescan').onclick = rescan;
async function rescan(){
  picked.clear(); updateBar();
  await api('/api/scan', {method:'POST'});
  poll();
}
window.rescan = rescan;
window.renderSetup = renderSetup;
</script>
</body>
</html>
